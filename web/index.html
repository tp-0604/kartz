<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kartz</title>
<meta name="theme-color" content="#edf1f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#070b11" media="(prefers-color-scheme: dark)">
<script>
  // The appearance somebody chose, applied before the first paint so the page never flashes the other one.
  try { var t = JSON.parse(localStorage.getItem('kartz.theme')); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
