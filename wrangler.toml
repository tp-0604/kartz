name = "kartz"
main = "worker.js"
compatibility_date = "2026-01-01"

# Lets the Worker call Cloudflare's own models as env.AI, with no token in the browser. It is
# also the last provider a question about a tab falls back to, so a deployment with no model
# key of its own still has one.
[ai]
binding = "AI"

# Nothing else. The site, the database and the picture store went with the spreadsheet app —
# the spreadsheet is the database now, and Google holds the files. What is left is the model
# key, which is the one thing a page cannot hold for itself.
